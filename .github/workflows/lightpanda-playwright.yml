name: Lightpanda + Playwright

on:
  push:
    branches: [main, ci-lightpanda]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: lp-simple-scraper/package-lock.json

      - name: Install Node dependencies
        working-directory: lp-simple-scraper
        run: npm ci

      - name: Install Lightpanda
        run: |
          curl -L -o lightpanda \
            https://github.com/lightpanda-io/browser/releases/download/0.3.0/lightpanda-x86_64-linux
          chmod +x lightpanda
          sudo mv lightpanda /usr/local/bin/lightpanda
          echo "Lightpanda version:" && lightpanda version

      - name: Start Lightpanda CDP server
        run: lightpanda serve --host 127.0.0.1 --port 9222 &

      - name: Wait for Lightpanda to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:9222/json/version && break
            echo "Waiting for Lightpanda... attempt $i"
            sleep 1
          done

      - name: Run Playwright tests
        working-directory: lp-simple-scraper
        run: npm test
        env:
          CDP_ENDPOINT: http://127.0.0.1:9222
